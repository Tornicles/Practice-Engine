kind = "mobile"
previewPath = "/practice-engine-mobile/"
title = "Startup Man Mobile"
description = "The mobile-first iOS and Android Startup Man app, helping coaches choose today's next action, rehearse difficult conversations, capture lived experience, and grow an evidence-backed coaching library from anywhere."
version = "1.0.0"
id = "artifacts/practice-engine-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/practice-engine-mobile/" ]
localPort = 19906

[services.development]
run = "pnpm --filter @workspace/practice-engine-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/practice-engine-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/practice-engine-mobile", "run", "serve" ]

[services.env]
PORT = "19906"
BASE_PATH = "/practice-engine-mobile/"
