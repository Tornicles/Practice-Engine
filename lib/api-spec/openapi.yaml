openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Practice Engine API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: practice
    description: Coaching practice and workspace operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /practice/overview:
    get:
      operationId: getPracticeOverview
      tags: [practice]
      summary: Get the workspace overview
      responses:
        "200":
          description: Workspace overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeOverview"
  /practice/profile:
    get:
      operationId: getPracticeProfile
      tags: [practice]
      summary: Get the coach profile
      responses:
        "200":
          description: Coach profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachProfile"
    patch:
      operationId: updatePracticeProfile
      tags: [practice]
      summary: Update the coach profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachProfileUpdate"
      responses:
        "200":
          description: Updated coach profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachProfile"
  /practice/experiences:
    get:
      operationId: listExperiences
      tags: [practice]
      summary: List captured coaching experiences
      responses:
        "200":
          description: Captured experiences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Experience"
    post:
      operationId: createExperience
      tags: [practice]
      summary: Capture a coaching experience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperienceInput"
      responses:
        "201":
          description: Created experience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"
  /practice/sessions:
    get:
      operationId: listPracticeSessions
      tags: [practice]
      summary: List practice sessions
      responses:
        "200":
          description: Practice sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PracticeSession"
    post:
      operationId: createPracticeSession
      tags: [practice]
      summary: Save a practice session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeSessionInput"
      responses:
        "201":
          description: Created practice session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeSession"
  /practice/assets:
    get:
      operationId: listKnowledgeAssets
      tags: [practice]
      summary: List generated knowledge and IP assets
      responses:
        "200":
          description: Knowledge assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeAsset"
  /practice/ai/simulate:
    post:
      operationId: simulateClientTurn
      tags: [practice]
      summary: Run one turn of an AI client simulation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationTurnInput"
      responses:
        "200":
          description: AI client reply and live coaching observation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationTurnResult"
  /practice/ai/extract:
    post:
      operationId: extractExperienceKnowledge
      tags: [practice]
      summary: Extract a lesson, principle, and insight from lived experience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperienceExtractionInput"
      responses:
        "200":
          description: Structured experience analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperienceExtractionResult"
  /practice/ai/generate:
    post:
      operationId: generateKnowledgeAsset
      tags: [practice]
      summary: Generate a traceable asset from coach knowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetGenerationInput"
      responses:
        "201":
          description: Generated and saved knowledge asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeAsset"
  /practice/ai/next-action:
    post:
      operationId: recommendNextAction
      tags: [practice]
      summary: Recommend the coach's highest-value next action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NextActionInput"
      responses:
        "200":
          description: Contextual recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NextActionResult"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CoachProfile:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        niche:
          type: string
        experienceLevel:
          type: string
        audience:
          type: string
        goal:
          type: string
        developmentFocus:
          type: string
        workingPreferences:
          type: string
        onboardingStep:
          type: number
        onboardingCompleted:
          type: boolean
        onboardingData:
          $ref: "#/components/schemas/OnboardingData"
        practiceScore:
          type: number
        streak:
          type: number
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - niche
        - experienceLevel
        - audience
        - goal
        - developmentFocus
        - workingPreferences
        - onboardingStep
        - onboardingCompleted
        - onboardingData
        - practiceScore
        - streak
        - updatedAt
    CoachProfileUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        niche:
          type: string
        experienceLevel:
          type: string
        audience:
          type: string
        goal:
          type: string
        developmentFocus:
          type: string
        workingPreferences:
          type: string
        onboardingStep:
          type: number
          minimum: 1
          maximum: 15
        onboardingCompleted:
          type: boolean
        onboardingData:
          $ref: "#/components/schemas/OnboardingData"
    OnboardingData:
      description: >-
        Additive, resumable state for the 15-step coach onboarding. Every
        property is optional so profiles created before onboarding data existed
        remain valid and each step can be persisted independently.
      type: object
      properties:
        goals:
          type: object
          properties:
            primaryGoal: { type: string, maxLength: 10000 }
            outcomes:
              type: array
              maxItems: 20
              items: { type: string, maxLength: 10000 }
            motivations:
              type: array
              maxItems: 20
              items: { type: string, maxLength: 10000 }
        profileDetails:
          type: object
          properties:
            name: { type: string, maxLength: 10000 }
            niche: { type: string, maxLength: 10000 }
            audience: { type: string, maxLength: 10000 }
            yearsCoaching: { type: number, minimum: 0, maximum: 100 }
            currentStage: { type: string, maxLength: 10000 }
            coachingTypes:
              type: array
              maxItems: 20
              items: { type: string, maxLength: 10000 }
        experienceDiscovery:
          type: object
          additionalProperties:
            oneOf:
              - { type: string, maxLength: 10000 }
              - { type: number }
              - { type: boolean }
              - type: array
                items: { type: string, maxLength: 10000 }
        skillRatings:
          type: object
          properties:
            listening: { type: number, minimum: 1, maximum: 5, multipleOf: 1 }
            questioning: { type: number, minimum: 1, maximum: 5, multipleOf: 1 }
            reframing: { type: number, minimum: 1, maximum: 5, multipleOf: 1 }
            challenging: { type: number, minimum: 1, maximum: 5, multipleOf: 1 }
            accountability: { type: number, minimum: 1, maximum: 5, multipleOf: 1 }
            sessionStructure: { type: number, minimum: 1, maximum: 5, multipleOf: 1 }
            handlingResistance: { type: number, minimum: 1, maximum: 5, multipleOf: 1 }
            interventionSelection: { type: number, minimum: 1, maximum: 5, multipleOf: 1 }
            coachingJudgment: { type: number, minimum: 1, maximum: 5, multipleOf: 1 }
        miniScenario:
          type: object
          properties:
            choice: { type: string, maxLength: 10000 }
            evaluation: { type: string, maxLength: 10000 }
            score: { type: number, minimum: 0, maximum: 100 }
        practice:
          type: object
          properties:
            sessionId: { type: number, minimum: 1, multipleOf: 1 }
            result: { type: string, maxLength: 10000 }
            skipped: { type: boolean }
        development:
          type: object
          properties:
            modes:
              type: array
              maxItems: 10
              items: { type: string, maxLength: 10000 }
            dailyTimeCommitment: { type: string, enum: ["10", "15", "30", "45", "60+"] }
            minutesPerWeek: { type: number, minimum: 0, maximum: 10080, multipleOf: 1 }
            schedule: { type: string, maxLength: 10000 }
        brand:
          type: object
          properties:
            discovery:
              type: object
              additionalProperties: { type: string, maxLength: 10000 }
            reviewState: { type: string, enum: [draft, reviewed, accepted, editing, rejected] }
        methodology:
          type: object
          properties:
            discovery:
              type: object
              additionalProperties: { type: string, maxLength: 10000 }
            candidates:
              type: array
              maxItems: 20
              items:
                type: object
                required: [title]
                properties:
                  title: { type: string, maxLength: 10000 }
                  description: { type: string, maxLength: 10000 }
            reviewState: { type: string, enum: [draft, keep, edit, discard] }
        build:
          type: object
          properties:
            ambitions:
              type: array
              maxItems: 20
              items: { type: string, maxLength: 10000 }
            firstBuild:
              type: object
              properties:
                title: { type: string, maxLength: 10000 }
                type: { type: string, maxLength: 10000 }
                description: { type: string, maxLength: 10000 }
        firstExperience:
          type: object
          properties:
            experienceId: { type: number, minimum: 1, multipleOf: 1 }
            captureState: { type: string, enum: [draft, saved, skipped] }
            whatHappened: { type: string, maxLength: 10000 }
            whoWasInvolved: { type: string, maxLength: 10000 }
            whatDidYouDo: { type: string, maxLength: 10000 }
            whatWereYouThinking: { type: string, maxLength: 10000 }
            whatWorked: { type: string, maxLength: 10000 }
            whatDidNotWork: { type: string, maxLength: 10000 }
            whatDidYouLearn: { type: string, maxLength: 10000 }
            whatWillYouDoDifferently: { type: string, maxLength: 10000 }
        experienceAnalysis:
          type: object
          properties:
            experience: { type: string, maxLength: 10000 }
            lesson: { type: string, maxLength: 10000 }
            principle: { type: string, maxLength: 10000 }
            framework: { type: string, maxLength: 10000 }
            reviewState: { type: string, enum: [draft, reviewed, accepted, editing, rejected] }
            notes: { type: string, maxLength: 10000 }
        firstChallenge:
          type: object
          properties:
            sessionId: { type: number, minimum: 1, multipleOf: 1 }
            result: { type: string, maxLength: 10000 }
            score: { type: number, minimum: 0, maximum: 100 }
            completed: { type: boolean }
            overallScore: { type: number, minimum: 0, maximum: 100 }
            questioningScore: { type: number, minimum: 0, maximum: 100 }
            listeningScore: { type: number, minimum: 0, maximum: 100 }
            reframingScore: { type: number, minimum: 0, maximum: 100 }
            challengingScore: { type: number, minimum: 0, maximum: 100 }
            accountabilityScore: { type: number, minimum: 0, maximum: 100 }
            strengths:
              type: array
              maxItems: 20
              items: { type: string, maxLength: 10000 }
            improvements:
              type: array
              maxItems: 20
              items: { type: string, maxLength: 10000 }
        thirtyDayPlan:
          type: object
          properties:
            plan:
              type: array
              maxItems: 31
              items: { type: string, maxLength: 10000 }
            sections:
              type: object
              properties:
                foundation:
                  type: array
                  maxItems: 31
                  items: { type: string, maxLength: 10000 }
                practice:
                  type: array
                  maxItems: 31
                  items: { type: string, maxLength: 10000 }
                reflection:
                  type: array
                  maxItems: 31
                  items: { type: string, maxLength: 10000 }
                building:
                  type: array
                  maxItems: 31
                  items: { type: string, maxLength: 10000 }
                milestones:
                  type: array
                  maxItems: 31
                  items: { type: string, maxLength: 10000 }
            accepted: { type: boolean }
            customization: { type: string, maxLength: 10000 }
        passport:
          type: object
          properties:
            reviewed: { type: boolean }
            notes: { type: string, maxLength: 10000 }
    Experience:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        situation:
          type: string
        learning:
          type: string
        principle:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - situation
        - learning
        - principle
        - status
        - createdAt
    ExperienceInput:
      type: object
      properties:
        clientRequestId:
          type: string
          minLength: 1
          maxLength: 128
        title:
          type: string
          minLength: 1
        situation:
          type: string
          minLength: 1
        learning:
          type: string
          minLength: 1
        principle:
          type: string
          minLength: 1
      required:
        - clientRequestId
        - title
        - situation
        - learning
        - principle
    PracticeSession:
      type: object
      properties:
        id:
          type: number
        clientRequestId:
          type: ["string", "null"]
        scenario:
          type: string
        category:
          type: string
        score:
          type: ["number", "null"]
        feedback:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - clientRequestId
        - scenario
        - category
        - score
        - feedback
        - completedAt
        - createdAt
    PracticeSessionInput:
      type: object
      properties:
        clientRequestId:
          type: string
          minLength: 1
          maxLength: 128
        scenario:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        score:
          type: number
          minimum: 0
          maximum: 100
        feedback:
          type: string
          minLength: 1
      required:
        - scenario
        - category
        - score
        - feedback
    SkillProgress:
      type: object
      properties:
        name:
          type: string
        score:
          type: number
        trend:
          type: string
      required:
        - name
        - score
        - trend
    PracticeJob:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        title:
          type: string
        description:
          type: string
        duration:
          type: string
      required:
        - id
        - kind
        - title
        - description
        - duration
    RecentActivity:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        detail:
          type: string
        kind:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - detail
        - kind
        - createdAt
    PracticeOverview:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/CoachProfile"
        experienceCount:
          type: number
        lessonCount:
          type: number
        principleCount:
          type: number
        frameworkCount:
          type: number
        ipAssetCount:
          type: number
        practiceSessionCount:
          type: number
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillProgress"
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/PracticeJob"
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/RecentActivity"
      required:
        - profile
        - experienceCount
        - lessonCount
        - principleCount
        - frameworkCount
        - ipAssetCount
        - practiceSessionCount
        - skills
        - jobs
        - recentActivity
    ConversationMessage:
      type: object
      properties:
        role:
          type: string
          enum: [coach, client]
        content:
          type: string
      required:
        - role
        - content
    SimulationTurnInput:
      type: object
      properties:
        scenario:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        difficulty:
          type: string
          minLength: 1
        coachMessage:
          type: string
          minLength: 1
        history:
          type: array
          items:
            $ref: "#/components/schemas/ConversationMessage"
      required:
        - scenario
        - category
        - difficulty
        - coachMessage
        - history
    SimulationTurnResult:
      type: object
      properties:
        clientReply:
          type: string
        observation:
          type: string
        skill:
          type: string
        score:
          type: number
        sessionComplete:
          type: boolean
      required:
        - clientReply
        - observation
        - skill
        - score
        - sessionComplete
    ExperienceExtractionInput:
      type: object
      properties:
        title:
          type: string
        situation:
          type: string
          minLength: 1
        coachReflection:
          type: string
      required:
        - title
        - situation
        - coachReflection
    ExperienceExtractionResult:
      type: object
      properties:
        title:
          type: string
        lesson:
          type: string
        principle:
          type: string
        insight:
          type: string
        frameworkCandidate:
          type: string
        evidenceGap:
          type: string
      required:
        - title
        - lesson
        - principle
        - insight
        - frameworkCandidate
        - evidenceGap
    AssetGenerationInput:
      type: object
      properties:
        sourceExperienceId:
          type: number
        assetType:
          type: string
          enum: [framework, exercise, case-study, content, workshop, course, offer, brand]
        objective:
          type: string
          minLength: 1
      required:
        - sourceExperienceId
        - assetType
        - objective
    KnowledgeAsset:
      type: object
      properties:
        id:
          type: number
        sourceExperienceId:
          type: number
        type:
          type: string
        title:
          type: string
        content:
          type: string
        status:
          type: string
        promptStrategy:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - sourceExperienceId
        - type
        - title
        - content
        - status
        - promptStrategy
        - createdAt
    NextActionInput:
      type: object
      properties:
        currentObjective:
          type: string
        availableMinutes:
          type: number
          minimum: 5
          maximum: 120
      required:
        - currentObjective
        - availableMinutes
    NextActionResult:
      type: object
      properties:
        action:
          type: string
        reason:
          type: string
        engine:
          type: string
        duration:
          type: string
        successCriteria:
          type: array
          items:
            type: string
      required:
        - action
        - reason
        - engine
        - duration
        - successCriteria